name: "Update nix flake inputs"

on:
  workflow_dispatch:
  schedule:
    - cron: 0 18 * * * # everyday 03:00 JST
defaults:
  run:
    shell: bash

jobs:
  update-nix:
    runs-on: macos-15
    permissions:
      contents: write
      issues: write
    env:
      GIT_AUTHOR_NAME: peacock0803sz
      GIT_AUTHOR_EMAIL: 33555487+peacock0803sz@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update flake inputs
        run: nix flake update

      # Kept as a separate step so a red run says whether the update or the
      # build broke. A lock that does not build must never reach main.
      - name: Build with updated inputs
        run: nix build .#default --no-link

      - name: Commit and push flake.lock
        run: |
          # Look only at flake.lock. Checking `git status` reacted to unrelated
          # untracked files and then failed in git commit with nothing staged.
          if git diff --quiet -- flake.lock; then
            echo "Nothing to commit"
            exit 0
          fi

          git add flake.lock
          git commit -m ":snowflake: Update flake.lock"
          git push origin HEAD

      # A red cron job alone goes unnoticed for months, which is how a stale
      # vendorHash silently froze flake.lock and blocked every PR.
      - name: Open tracking issue on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Nightly flake update is failing
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "Issue #$existing is already open. Nothing to do."
            exit 0
          fi

          {
            printf '%s\n\n' "The \`Update nix flake inputs\` workflow failed."
            printf '%s\n\n' "Failed run: $RUN_URL"
            printf '%s\n' "While this job fails, flake.lock is never updated."
            printf '%s\n\n' "\`nix-build\` is a required check, so every pull request stays blocked."
            printf '%s\n\n' "The usual cause is a Go dependency bump changing go.sum, which leaves vendorHash in nix/package.nix stale."
            printf '%s\n' "See the Nix Packaging section of CONTRIBUTING.md for how to refresh it."
          } > "$RUNNER_TEMP/issue-body.md"

          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue-body.md"
