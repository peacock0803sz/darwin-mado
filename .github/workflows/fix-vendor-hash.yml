name: Fix vendorHash

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  fix-vendor-hash:
    # Fork PRs never get a write-capable token, so the push below would fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15 # packages.default is darwin-only, see lib.optionalAttrs in flake.nix
    env:
      GIT_AUTHOR_NAME: peacock0803sz
      GIT_AUTHOR_EMAIL: 33555487+peacock0803sz@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # A commit pushed with GITHUB_TOKEN does not trigger workflows, which
          # would leave the required nix-build check unreported and block the PR.
          token: ${{ secrets.GH_PAT }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Recompute vendorHash
        run: nix run nixpkgs#nix-update -- --flake --version=skip default

      - name: Verify full build
        run: nix build .#default --no-link

      - name: Commit and push if changed
        env:
          # Passed as an environment variable rather than interpolated into the
          # script: a branch name is attacker-controlled and would be injected.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Skipping the push when nothing changed is what stops the loop: the
          # run triggered by our own PAT push finds the hash already correct.
          if git diff --quiet -- nix/package.nix; then
            echo "vendorHash is already up to date. Nothing to do."
            exit 0
          fi

          git add nix/package.nix
          git commit -m ":snowflake: Refresh vendorHash for updated Go modules"
          git push origin "HEAD:$HEAD_REF"
